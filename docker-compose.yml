version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto_forensics_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_forensics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-crypto_forensics}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - forensics_network

  neo4j:
    image: neo4j:5-enterprise
    container_name: crypto_forensics_neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-TestPassword123}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=eval
      - NEO4J_PLUGINS=["graph-data-science", "apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
      - ./database/neo4j:/database/neo4j
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-TestPassword123} 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forensics_network

  redis:
    image: redis:7-alpine
    container_name: crypto_forensics_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - forensics_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: crypto_forensics_server
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-crypto_forensics}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-TestPassword123}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - JWT_ALGORITHM=RS256
      - JWT_PRIVATE_KEY_PATH=/app/certs/private_key.pem
      - JWT_PUBLIC_KEY_PATH=/app/certs/public_key.pem
    ports:
      - "${SERVER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - evidence_vault:/data/evidence
    networks:
      - forensics_network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: crypto_forensics_worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-crypto_forensics}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-TestPassword123}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./worker:/app
      - evidence_vault:/data/evidence
    networks:
      - forensics_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: crypto_forensics_client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    networks:
      - forensics_network

  nginx:
    image: nginx:alpine
    container_name: crypto_forensics_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - server
    networks:
      - forensics_network

  prometheus:
    image: prom/prometheus:latest
    container_name: crypto_forensics_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - forensics_network

networks:
  forensics_network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_plugins:
  redis_data:
  evidence_vault:
  prometheus_data:
