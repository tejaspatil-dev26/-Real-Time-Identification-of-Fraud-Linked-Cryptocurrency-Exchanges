[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-forensics-server"
version = "1.0.0"
description = "Real-Time Crypto-Forensics & Fraud-Linked VASP Identification Platform - FastAPI Gateway"
authors = [{ name = "Forensics Intelligence Engineering" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "neo4j>=5.18.0",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "pyjwt[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "reportlab>=4.1.0",
    "cryptography>=42.0.5"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
